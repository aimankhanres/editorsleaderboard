# Fallback scheduler for the Vercel Hobby plan (Hobby crons run at most once a day).
# Needs repo secrets SYNC_URL (https://<app>.vercel.app/api/sync) and CRON_SECRET.
# Does nothing until SYNC_URL is set. GitHub may delay scheduled runs by a few minutes.
name: Sync leaderboard
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/sync
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SYNC_URL" ]; then echo "SYNC_URL not set, skipping"; exit 0; fi
          curl -sS --fail-with-body --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "$SYNC_URL"
