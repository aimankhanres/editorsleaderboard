# Fallback scheduler for the Vercel Hobby plan (Hobby crons run at most once a day).
# Needs repo secrets SYNC_URL (https://<app>.vercel.app/api/sync) and CRON_SECRET.
# Does nothing until SYNC_URL is set. GitHub may delay scheduled runs by a few minutes.
name: Sync leaderboard
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Call /api/sync
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SYNC_URL" ]; then echo "SYNC_URL not set, skipping"; exit 0; fi
          # A brief Triple Whale outage (503/504) is retried once, then logged as a warning instead of failing
          # the run (no failure email); the next run 15 minutes later catches up. Any other error still fails.
          for attempt in 1 2; do
            code=$(curl -sS -o body.json -w '%{http_code}' --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$SYNC_URL" || echo 000)
            cat body.json 2>/dev/null; echo
            [ "$code" = "200" ] && exit 0
            if grep -qE 'Triple Whale (5[0-9]{2}|400: Request failed with status code 5)' body.json 2>/dev/null; then
              [ "$attempt" = 1 ] && { echo "Triple Whale unavailable, retrying in 60s"; sleep 60; continue; }
              echo "::warning::Triple Whale was unavailable; the next scheduled sync will catch up"; exit 0
            fi
            echo "::error::Sync failed with HTTP $code"; exit 1
          done
